<script>


// =========================================================
// GOOGLE APPS SCRIPT API
// =========================================================

const API =
"https://script.google.com/macros/s/AKfycbzwwmgZ-p416-if5QORnTZLURHCLyX23qiDvcjMAKsyo54zNWWt4ilbFr1YgGxecBBeXw/exec";


let allIndividuals = [];

let allSessions = [];


// =========================================================
// HELPERS
// =========================================================

function escapeHTML(value) {

    return String(value ?? "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


function numberValue(value) {

    const n =
    Number(
        String(value ?? "")
        .replace(/,/g,"")
        .trim()
    );


    return isNaN(n)
        ? 0
        : n;

}


function formatPoints(value) {

    return numberValue(value)
        .toLocaleString();

}


// =========================================================
// LOAD SCOREBOARD
// =========================================================

function loadScoreboard() {

    fetch(
        API +
        "?t=" +
        Date.now()
    )

    .then(function(response) {

        if (!response.ok) {

            throw new Error(
                "API error"
            );

        }


        return response.json();

    })


    .then(function(data) {

        allIndividuals =
        data.allIndividuals || [];


        allSessions =
        data.sessions || [];


        renderFastest(
            data.fastest || []
        );


        renderTeams(
            data.teams || []
        );


        renderIndividuals(
            data.individuals || []
        );


        renderSessionDropdown(
            allSessions
        );


        document.getElementById(
            "updated"
        ).innerText =
        "Last updated: " +
        new Date()
        .toLocaleTimeString();

    })


    .catch(function(error) {

        console.error(error);


        document.getElementById(
            "fastest"
        ).innerHTML =
        `<div class="error">
            Unable to load fastest-to-enter data.
        </div>`;


        document.getElementById(
            "teams"
        ).innerHTML =
        `<div class="error">
            Unable to load team leaderboard.
        </div>`;


        document.getElementById(
            "top5"
        ).innerHTML =
        `<div class="error">
            Unable to load individual leaderboard.
        </div>`;


        document.getElementById(
            "sessionScores"
        ).innerHTML =
        `<div class="error">
            Unable to load session scores.
        </div>`;

    });

}


// =========================================================
// FASTEST TO ENTER
// =========================================================

function renderFastest(fastest) {

    const container =
    document.getElementById(
        "fastest"
    );


    if (!fastest.length) {

        container.innerHTML =
        `<div class="error">
            No fastest-to-enter data available.
        </div>`;

        return;

    }


    container.innerHTML =
    fastest.map(function(item) {

        return `

            <div class="fastest">

                <div class="fastest-title">

                    🏆
                    ${escapeHTML(item.slot)}
                    Winner

                </div>


                <div class="fastest-body">

                    <div class="fastest-name">

                        ${escapeHTML(item.name)}

                    </div>


                    <div class="fastest-info">

                        URN:
                        <strong>
                            ${escapeHTML(item.urn)}
                        </strong>

                        ${
                            item.team
                            ? `
                                &nbsp; · &nbsp;
                                Team:
                                <strong>
                                    ${escapeHTML(item.team)}
                                </strong>
                            `
                            : ""
                        }

                    </div>


                    <div class="fastest-time">

                        ⏱
                        ${escapeHTML(item.time)}

                    </div>

                </div>

            </div>

        `;

    }).join("");

}


// =========================================================
// TEAM LEADERBOARD
// =========================================================

function renderTeams(teams) {

    const container =
    document.getElementById(
        "teams"
    );


    if (!teams.length) {

        container.innerHTML =
        `<div class="error">
            No team scores available.
        </div>`;

        return;

    }


    teams.sort(function(a,b) {

        return numberValue(b.score)
             - numberValue(a.score);

    });


    container.innerHTML =
    teams.slice(0,10)
    .map(function(team,index) {

        const rank =
        index + 1;


        const medal =
        rank === 1
        ? "🏆"
        : "";


        return `

            <div class="row">

                <div class="rank">

                    ${rank}

                </div>


                <div>

                    <div class="name">

                        ${
                            medal
                            ? `
                                <span class="medal">
                                    ${medal}
                                </span>
                            `
                            : ""
                        }

                        Team
                        ${escapeHTML(team.team)}

                    </div>

                </div>


                <div class="score">

                    ${formatPoints(team.score)}
                    pts

                </div>

            </div>

        `;

    })
    .join("");

}


// =========================================================
// TOP 5 INDIVIDUALS
// =========================================================

function renderIndividuals(individuals) {

    const container =
    document.getElementById(
        "top5"
    );


    if (!individuals.length) {

        container.innerHTML =
        `<div class="error">
            No individual scores available.
        </div>`;

        return;

    }


    individuals.sort(function(a,b) {

        return numberValue(b.score)
             - numberValue(a.score);

    });


    const top5 =
    individuals.slice(0,5);


    container.innerHTML =
    top5.map(function(person,index) {

        const rank =
        index + 1;


        let medal = "";


        if(rank === 1) {

            medal = "🥇";

        }

        else if(rank === 2) {

            medal = "🥈";

        }

        else if(rank === 3) {

            medal = "🥉";

        }


        return `

            <div class="row">

                <div class="rank">

                    ${rank}

                </div>


                <div>

                    <div class="name">

                        ${
                            medal
                            ? `
                                <span class="medal">
                                    ${medal}
                                </span>
                            `
                            : ""
                        }

                        ${escapeHTML(person.name)}

                    </div>


                    <div class="sub">

                        URN:
                        ${escapeHTML(person.urn)}

                    </div>

                </div>


                <div class="score">

                    ${formatPoints(person.score)}
                    pts

                </div>

            </div>

        `;

    })
    .join("");

}


// =========================================================
// SESSION DROPDOWN
// =========================================================

function renderSessionDropdown(sessions) {

    const select =
    document.getElementById(
        "sessionSelect"
    );


    if(!sessions.length) {

        select.innerHTML =
        `<option value="">
            No Sessions Available
        </option>`;


        document.getElementById(
            "sessionScores"
        ).innerHTML =
        `<div class="no-session-data">
            No session data available.
        </div>`;

        return;

    }


    /*
     * Latest session first.
     */

    sessions.sort(function(a,b) {

        return numberValue(b.session)
             - numberValue(a.session);

    });


    select.innerHTML =
    sessions.map(function(session) {

        return `

            <option value="${escapeHTML(session.session)}">

                Session
                ${escapeHTML(session.session)}

            </option>

        `;

    }).join("");


    /*
     * Automatically display latest session.
     */

    select.value =
    sessions[0].session;


    showSelectedSession();

}


// =========================================================
// SHOW SELECTED SESSION
// =========================================================

function showSelectedSession() {

    const select =
    document.getElementById(
        "sessionSelect"
    );


    const selectedSession =
    String(select.value);


    const container =
    document.getElementById(
        "sessionScores"
    );


    const session =
    allSessions.find(function(item) {

        return String(item.session)
        === selectedSession;

    });


    if(!session) {

        container.innerHTML =
        `<div class="no-session-data">
            No data available for this session.
        </div>`;

        return;

    }


    const people = [];


    /*
     * Winner
     */

    if(session.winner) {

        people.push({

            ...session.winner,

            isWinner:true

        });

    }


    /*
     * Close finishers
     */

    if(
        Array.isArray(
            session.closeFinishers
        )
    ) {

        session.closeFinishers
        .forEach(function(person) {

            people.push({

                ...person,

                isWinner:false

            });

        });

    }


    /*
     * Sort highest points first.
     */

    people.sort(function(a,b) {

        return numberValue(b.points)
             - numberValue(a.points);

    });


    if(!people.length) {

        container.innerHTML =
        `<div class="no-session-data">
            No individual scores are available
            for Session ${escapeHTML(selectedSession)}.
        </div>`;

        return;

    }


    container.innerHTML = `

        <div class="session-score-box">

            <div class="session-score-header">

                Session
                ${escapeHTML(selectedSession)}
                — Individual Scores

            </div>


            ${
                people.map(function(person,index) {

                    const rank =
                    index + 1;


                    let medal = "";


                    if(rank === 1) {

                        medal = "🥇";

                    }

                    else if(rank === 2) {

                        medal = "🥈";

                    }

                    else if(rank === 3) {

                        medal = "🥉";

                    }


                    return `

                        <div class="
                            session-score-row
                            ${person.isWinner
                            ? "session-winner-row"
                            : ""}
                        ">


                            <div
                            class="session-score-rank">

                                ${rank}

                            </div>


                            <div>

                                ${
                                    person.isWinner
                                    ? `
                                        <div
                                        class="session-winner-badge">

                                            🏆 WINNER

                                        </div>
                                    `
                                    : ""
                                }


                                <div
                                class="session-score-name">

                                    ${
                                        medal
                                        ? `
                                            <span class="medal">
                                                ${medal}
                                            </span>
                                        `
                                        : ""
                                    }

                                    ${escapeHTML(
                                        person.name
                                    )}

                                </div>


                                <div
                                class="session-score-info">

                                    URN:
                                    <strong>
                                        ${escapeHTML(
                                            person.urn
                                        )}
                                    </strong>


                                    ${
                                        person.team
                                        ? `
                                            <br>
                                            Team:
                                            <strong>
                                                ${escapeHTML(
                                                    person.team
                                                )}
                                            </strong>
                                        `
                                        : ""
                                    }


                                    ${
                                        person.time
                                        ? `
                                            <br>
                                            ⏱
                                            ${escapeHTML(
                                                person.time
                                            )}
                                        `
                                        : ""
                                    }

                                </div>

                            </div>


                            <div
                            class="session-score-points">

                                ${formatPoints(
                                    person.points
                                )}

                                pts

                            </div>

                        </div>

                    `;

                }).join("")
            }

        </div>

    `;

}


// =========================================================
// SEARCH YOUR URN
// =========================================================

function searchURN() {

    const input =
    document.getElementById(
        "urn"
    );


    const result =
    document.getElementById(
        "result"
    );


    const urn =
    input.value
    .trim()
    .toUpperCase();


    if(!urn) {

        result.innerHTML =
        `<div class="error">

            Please enter your URN.

        </div>`;

        return;

    }


    const person =
    allIndividuals.find(
        function(item) {

            return String(
                item.urn || ""
            )
            .trim()
            .toUpperCase()
            === urn;

        }
    );


    if(!person) {

        result.innerHTML =
        `<div class="error">

            URN

            <strong>
                ${escapeHTML(urn)}
            </strong>

            was not found.

        </div>`;

        return;

    }


    result.innerHTML = `

        <div class="result">

            <h3>

                ${escapeHTML(
                    person.name
                )}

            </h3>


            <p>

                <strong>
                    URN:
                </strong>

                ${escapeHTML(
                    person.urn
                )}

            </p>


            ${
                person.company
                ? `
                    <p>

                        <strong>
                            Company:
                        </strong>

                        ${escapeHTML(
                            person.company
                        )}

                    </p>
                `
                : ""
            }


            ${
                person.designation
                ? `
                    <p>

                        <strong>
                            Designation:
                        </strong>

                        ${escapeHTML(
                            person.designation
                        )}

                    </p>
                `
                : ""
            }


            ${
                person.team
                ? `
                    <p>

                        <strong>
                            Team:
                        </strong>

                        ${escapeHTML(
                            person.team
                        )}

                    </p>
                `
                : ""
            }


            <p>

                <strong>
                    Rank:
                </strong>

                #${escapeHTML(
                    person.rank || "-"
                )}

            </p>


            <div class="result-score">

                ${formatPoints(
                    person.score
                )}

                Points

            </div>

        </div>

    `;

}


// =========================================================
// ENTER KEY FOR URN SEARCH
// =========================================================

document
.getElementById("urn")
.addEventListener(
    "keydown",
    function(event) {

        if(event.key === "Enter") {

            searchURN();

        }

    }
);


// =========================================================
// INITIAL LOAD
// =========================================================

loadScoreboard();


// =========================================================
// AUTO REFRESH EVERY 10 SECONDS
// =========================================================

setInterval(
    loadScoreboard,
    10000
);

</script>
