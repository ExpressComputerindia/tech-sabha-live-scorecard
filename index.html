<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tech Sabha 2026 | Live Scoreboard</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fb;
    color: #172033;
}

/* HEADER */

.header {
    background: #111827;
    color: white;
    padding: 28px 18px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 30px;
}

.header p {
    margin: 7px 0 0;
    color: #cbd5e1;
}

/* MAIN */

.wrap {
    max-width: 850px;
    margin: auto;
    padding: 20px 14px 40px;
}

/* CARDS */

.card {
    background: white;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.07);
}

.card h2 {
    margin: 0 0 14px;
}

/* SEARCH */

.search {
    display: flex;
    gap: 9px;
}

input {
    flex: 1;
    padding: 13px 14px;
    border: 1px solid #d5dbe5;
    border-radius: 11px;
    font-size: 16px;
    outline: none;
}

button {
    border: 0;
    border-radius: 11px;
    padding: 0 19px;
    background: #2563eb;
    color: white;
    font-weight: 700;
    cursor: pointer;
}

/* TOP 5 */

.person {
    display: grid;
    grid-template-columns: 60px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid #edf0f5;
}

.person:last-child {
    border-bottom: 0;
}

.rank {
    font-weight: 800;
    font-size: 18px;
    text-align: center;
}

.name {
    font-weight: 800;
    font-size: 17px;
}

.urn {
    font-size: 13px;
    color: #64748b;
    margin-top: 3px;
}

.score {
    font-size: 20px;
    font-weight: 900;
    text-align: right;
}

/* TEAM */

.team {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 5px;
    font-size: 13px;
    color: #475569;
}

.dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
}

/* TEAM LEADERBOARD */

.teamrow {
    display: grid;
    grid-template-columns: 55px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid #edf0f5;
}

.teamrow:last-child {
    border-bottom: 0;
}

.teamrank {
    font-weight: 800;
    font-size: 18px;
    text-align: center;
}

.teamname {
    font-weight: 800;
    font-size: 17px;
}

.teampoints {
    font-size: 20px;
    font-weight: 900;
}

/* PERSONAL RESULT */

.detail {
    background: #f8fafc;
    border-radius: 13px;
    padding: 15px;
    margin-top: 14px;
}
