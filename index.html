<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  Technology Sabha 2026 | Live Scorecard
</title>


<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #f4f7fb,
      #eef2f7
    );

  color: #172033;

}


/* =========================================================
   HEADER
========================================================= */

.header {

  background:
    linear-gradient(
      135deg,
      #111827,
      #1e293b
    );

  color: white;

  text-align: center;

  padding: 35px 18px;

  box-shadow:
    0 5px 25px rgba(0,0,0,.15);

}

.header h1 {

  margin: 0;

  font-size: 34px;

  letter-spacing: 1px;

}

.header .city {

  margin-top: 7px;

  font-size: 19px;

  font-weight: bold;

  color: #facc15;

}

.header .headline {

  margin: 12px auto 0;

  max-width: 900px;

  font-size: 16px;

  color: #cbd5e1;

}

.header .live {

  display: inline-block;

  margin-top: 18px;

  padding: 7px 16px;

  border-radius: 30px;

  background: #dc2626;

  color: white;

  font-size: 13px;

  font-weight: bold;

  letter-spacing: 1px;

}


/* =========================================================
   MAIN WRAPPER
========================================================= */

.wrap {

  width: 100%;

  max-width: 1000px;

  margin: auto;

  padding:
    22px 15px 50px;

}


/* =========================================================
   CARD
========================================================= */

.card {

  background: white;

  border-radius: 18px;

  padding: 22px;

  margin-bottom: 20px;

  box-shadow:
    0 5px 20px rgba(15,23,42,.08);

}

.card h2 {

  margin:
    0 0 18px;

  font-size: 22px;

}


/* =========================================================
   COMMON ROW
========================================================= */

.row {

  display: grid;

  grid-template-columns:
    55px
    1fr
    auto;

  gap: 15px;

  align-items: center;

  padding: 15px 5px;

  border-bottom:
    1px solid #e5e7eb;

}

.row:last-child {

  border-bottom: 0;

}


.rank {

  text-align: center;

  font-size: 20px;

  font-weight: bold;

}

.rank-one {

  color: #b45309;

}


.name {

  font-size: 18px;

  font-weight: bold;

}


.sub {

  margin-top: 5px;

  color: #64748b;

  font-size: 13px;

}


.score {

  text-align: right;

  font-size: 18px;

  font-weight: bold;

  white-space: nowrap;

}


/* =========================================================
   MEDALS
========================================================= */

.medal {

  display: inline-block;

  margin-right: 7px;

  font-size: 21px;

  vertical-align: middle;

}


/* =========================================================
   FASTEST TO ENTER
========================================================= */

.fastest {

  border:
    1px solid #e5e7eb;

  border-radius: 14px;

  margin-bottom: 12px;

  overflow: hidden;

}


.fastest-title {

  background: #111827;

  color: white;

  padding: 13px 15px;

  font-size: 15px;

  font-weight: bold;

}


.fastest-body {

  padding: 15px;

}


.fastest-name {

  font-size: 20px;

  font-weight: bold;

}


.fastest-info {

  margin-top: 7px;

  color: #475569;

  font-size: 14px;

}


.fastest-time {

  margin-top: 10px;

  font-size: 18px;

  font-weight: bold;

  color: #2563eb;

}


/* =========================================================
   SESSION WINNERS
========================================================= */

.session {

  border:
    1px solid #e2e8f0;

  border-radius: 16px;

  overflow: hidden;

  margin-bottom: 15px;

}


.session-title {

  padding: 15px 16px;

  background:
    linear-gradient(
      135deg,
      #f1f5f9,
      #e8eef5
    );

  font-size: 16px;

  line-height: 1.5;

}


.session-title strong {

  font-size: 17px;

  color: #172033;

}


.session-description {

  margin-top: 6px;

  color: #475569;

  font-size: 14px;

  font-weight: 500;

  line-height: 1.55;

}


/* =========================================================
   SESSION WINNER
========================================================= */

.session-winner {

  padding: 18px;

  background:
    linear-gradient(
      135deg,
      #fff7ed,
      #fffbeb
    );

}


.winner-label {

  display: inline-block;

  margin-bottom: 8px;

  padding: 5px 10px;

  border-radius: 20px;

  background: #f59e0b;

  color: white;

  font-size: 12px;

  font-weight: bold;

}


.winner-name {

  font-size: 22px;

  font-weight: bold;

}


.winner-details {

  margin-top: 8px;

  color: #475569;

  line-height: 1.6;

}


/* =========================================================
   SEARCH
========================================================= */

.search {

  display: flex;

  gap: 10px;

}


input {

  flex: 1;

  min-width: 0;

  padding: 14px;

  border:
    1px solid #cbd5e1;

  border-radius: 10px;

  font-size: 16px;

}


button {

  border: 0;

  border-radius: 10px;

  padding: 13px 20px;

  background: #2563eb;

  color: white;

  font-weight: bold;

  cursor: pointer;

}


button:hover {

  background: #1d4ed8;

}


.result {

  margin-top: 15px;

  padding: 18px;

  border-radius: 14px;

  background: #f8fafc;

}


.result h3 {

  margin-top: 0;

  font-size: 22px;

}


.result-score {

  margin-top: 15px;

  font-size: 25px;

  font-weight: bold;

  color: #2563eb;

}


/* =========================================================
   ERROR
========================================================= */

.error {

  padding: 13px;

  border-radius: 10px;

  background: #fee2e2;

  color: #991b1b;

}


/* =========================================================
   UPDATED
========================================================= */

.updated {

  text-align: center;

  color: #64748b;

  font-size: 12px;

  margin-top: 10px;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px) {

  .header h1 {

    font-size: 27px;

  }


  .row {

    grid-template-columns:
      42px
      1fr
      auto;

    gap: 8px;

  }


  .name {

    font-size: 16px;

  }


  .score {

    font-size: 16px;

  }


  .search {

    flex-direction: column;

  }


  button {

    width: 100%;

  }


  .session-title strong {

    font-size: 16px;

  }


  .session-description {

    font-size: 13px;

  }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<div class="header">

  <h1>
    TECHNOLOGY SABHA 2026
  </h1>

  <div class="city">
    Jaipur
  </div>

  <div class="headline">
    India Ascending From Digital Infrastructure
    to Intelligent Governance
  </div>

  <div class="live">
    LIVE SCORECARD
  </div>

</div>


<div class="wrap">


<!-- =======================================================
     FASTEST TO ENTER
======================================================= -->

<div class="card">

  <h2>
    ⚡ Fastest to Enter
  </h2>

  <div id="fastest">
    Loading...
  </div>

</div>


<!-- =======================================================
     TEAM LEADERBOARD
======================================================= -->

<div class="card">

  <h2>
    🏆 Team Leaderboard
  </h2>

  <div id="teams">
    Loading...
  </div>

</div>


<!-- =======================================================
     TOP 5 INDIVIDUALS
======================================================= -->

<div class="card">

  <h2>
    👤 Top 5 Individuals
  </h2>

  <div id="top5">
    Loading...
  </div>

</div>


<!-- =======================================================
     SEARCH URN
======================================================= -->

<div class="card">

  <h2>
    🔎 Search Your URN
  </h2>

  <div class="search">

    <input
      id="urn"
      placeholder="Enter your URN"
    >

    <button
      onclick="searchURN()"
    >
      GET TO KNOW YOUR SCORE
    </button>

  </div>

  <div id="result"></div>

</div>


<!-- =======================================================
     SESSION WINNERS
======================================================= -->

<div class="card">

  <h2>
    🏅 Session Winners
  </h2>

  <div id="sessions">
    Loading...
  </div>

</div>


<div
  id="updated"
  class="updated"
></div>


</div>


<script>


// =========================================================
// GOOGLE APPS SCRIPT API
// =========================================================

const API =
  "https://script.google.com/macros/s/AKfycbzwwmgZ-p416-if5QORnTZLURHCLyX23qiDvcjMAKsyo54zNWWt4ilbFr1YgGxecBBeXw/exec";


let allIndividuals = [];


// =========================================================
// HELPERS
// =========================================================

function escapeHTML(value) {

  return String(
    value ?? ""
  )
  .replace(/&/g, "&amp;")
  .replace(/</g, "&lt;")
  .replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;")
  .replace(/'/g, "&#039;");

}


function numberValue(value) {

  const n = Number(
    String(value ?? "")
      .replace(/,/g, "")
      .trim()
  );

  return isNaN(n)
    ? 0
    : n;

}


function formatPoints(value) {

  return numberValue(value)
    .toLocaleString();

}


// =========================================================
// LOAD SCOREBOARD
// =========================================================

function loadScoreboard() {

  fetch(
    API +
    "?t=" +
    Date.now()
  )

  .then(function(response) {

    if (!response.ok) {

      throw new Error(
        "API error"
      );

    }

    return response.json();

  })

  .then(function(data) {

    allIndividuals =
      data.allIndividuals || [];


    renderFastest(
      data.fastest || []
    );


    renderTeams(
      data.teams || []
    );


    renderIndividuals(
      data.individuals || []
    );


    renderSessions(
      data.sessions || []
    );


    document.getElementById(
      "updated"
    ).innerText =
      "Last updated: " +
      new Date()
        .toLocaleTimeString();

  })

  .catch(function(error) {

    console.error(error);


    document.getElementById(
      "fastest"
    ).innerHTML =
      `<div class="error">
        Unable to load fastest-to-enter data.
      </div>`;


    document.getElementById(
      "teams"
    ).innerHTML =
      `<div class="error">
        Unable to load team leaderboard.
      </div>`;


    document.getElementById(
      "top5"
    ).innerHTML =
      `<div class="error">
        Unable to load individual leaderboard.
      </div>`;


    document.getElementById(
      "sessions"
    ).innerHTML =
      `<div class="error">
        Unable to load session winners.
      </div>`;

  });

}


// =========================================================
// FASTEST TO ENTER
// =========================================================

function renderFastest(fastest) {

  const container =
    document.getElementById(
      "fastest"
    );


  if (!fastest.length) {

    container.innerHTML =
      `<div class="error">
        No fastest-to-enter data available.
      </div>`;

    return;

  }


  container.innerHTML =
    fastest
      .map(function(item) {

        return `

          <div class="fastest">

            <div class="fastest-title">

              🏆
              ${escapeHTML(item.slot)}

              Winner

            </div>


            <div class="fastest-body">

              <div class="fastest-name">

                ${escapeHTML(item.name)}

              </div>


              <div class="fastest-info">

                URN:

                <strong>
                  ${escapeHTML(item.urn)}
                </strong>

                ${
                  item.team
                    ? `

                      &nbsp; · &nbsp;

                      Team:

                      <strong>
                        ${escapeHTML(item.team)}
                      </strong>

                    `
                    : ""
                }

              </div>


              <div class="fastest-time">

                ⏱
                ${escapeHTML(item.time)}

              </div>

            </div>

          </div>

        `;

      })
      .join("");

}


// =========================================================
// TEAM LEADERBOARD
// =========================================================

function renderTeams(teams) {

  const container =
    document.getElementById(
      "teams"
    );


  if (!teams.length) {

    container.innerHTML =
      `<div class="error">
        No team scores available.
      </div>`;

    return;

  }


  // Highest score first.

  teams.sort(function(a, b) {

    return (
      numberValue(b.score) -
      numberValue(a.score)
    );

  });


  container.innerHTML =
    teams
      .slice(0, 10)
      .map(function(team, index) {

        const rank =
          index + 1;


        // ONLY FIRST TEAM GETS TROPHY.

        const medal =
          rank === 1
            ? "🏆"
            : "";


        return `

          <div class="row">

            <div class="
              rank
              ${rank === 1 ? "rank-one" : ""}
            ">

              ${rank}

            </div>


            <div>

              <div class="name">

                ${
                  medal
                    ? `
                      <span class="medal">
                        ${medal}
                      </span>
                    `
                    : ""
                }

                Team ${escapeHTML(
                  team.team
                )}

              </div>

            </div>


            <div class="score">

              ${formatPoints(
                team.score
              )}

              pts

            </div>

          </div>

        `;

      })
      .join("");

}


// =========================================================
// TOP 5 INDIVIDUALS
// =========================================================

function renderIndividuals(individuals) {

  const container =
    document.getElementById(
      "top5"
    );


  if (!individuals.length) {

    container.innerHTML =
      `<div class="error">
        No individual scores available.
      </div>`;

    return;

  }


  // Highest score first.

  individuals.sort(function(a, b) {

    return (
      numberValue(b.score) -
      numberValue(a.score)
    );

  });


  const top5 =
    individuals.slice(0, 5);


  container.innerHTML =
    top5
      .map(function(person, index) {

        const rank =
          index + 1;


        let medal = "";


        if (rank === 1) {

          medal = "🥇";

        } else if (rank === 2) {

          medal = "🥈";

        } else if (rank === 3) {

          medal = "🥉";

        }


        return `

          <div class="row">

            <div class="
              rank
              ${rank === 1 ? "rank-one" : ""}
            ">

              ${rank}

            </div>


            <div>

              <div class="name">

                ${
                  medal
                    ? `
                      <span class="medal">
                        ${medal}
                      </span>
                    `
                    : ""
                }

                ${escapeHTML(
                  person.name
                )}

              </div>


              <div class="sub">

                URN:

                ${escapeHTML(
                  person.urn
                )}

              </div>

            </div>


            <div class="score">

              ${formatPoints(
                person.score
              )}

              pts

            </div>

          </div>

        `;

      })
      .join("");

}


// =========================================================
// SESSION WINNERS
// =========================================================

function renderSessions(sessions) {

  const container =
    document.getElementById(
      "sessions"
    );


  if (!sessions.length) {

    container.innerHTML =
      `<div class="error">
        No session winners available.
      </div>`;

    return;

  }


  // =======================================================
  // LATEST SESSION FIRST
  //
  // 23
  // 22
  // 21
  // ...
  // 3
  // 2
  // 1
  // =======================================================

  sessions.sort(function(a, b) {

    return (
      numberValue(b.session) -
      numberValue(a.session)
    );

  });


  container.innerHTML =
    sessions
      .map(function(session) {

        const winners =
          session.winners || [];


        if (!winners.length) {

          return "";

        }


        // Dynamic title from Google Sheet / API.

        const title =
          session.title || "";


        // =================================================
        // WINNERS
        // =================================================

        const winnersHTML =
          winners
            .map(function(winner) {

              return `

                <div class="session-winner">

                  <div class="winner-label">

                    🏆 WINNER

                  </div>


                  <div class="winner-name">

                    ${escapeHTML(
                      winner.name
                    )}

                  </div>


                  <div class="winner-details">

                    ${
                      winner.urn
                        ? `

                          URN:

                          <strong>
                            ${escapeHTML(
                              winner.urn
                            )}
                          </strong>

                        `
                        : ""
                    }


                    ${
                      winner.team
                        ? `

                          <br>

                          Team:

                          <strong>
                            ${escapeHTML(
                              winner.team
                            )}
                          </strong>

                        `
                        : ""
                    }


                    ${
                      winner.time
                        ? `

                          <br>

                          ⏱ Time:

                          <strong>
                            ${escapeHTML(
                              winner.time
                            )}
                          </strong>

                        `
                        : ""
                    }

                  </div>

                </div>

              `;

            })
            .join("");


        // =================================================
        // SESSION CARD
        // =================================================

        return `

          <div class="session">


            <div class="session-title">

              <strong>

                Session
                ${escapeHTML(
                  session.session
                )}

              </strong>


              ${
                title
                  ? `

                    <div
                      class="session-description"
                    >

                      ${escapeHTML(
                        title
                      )}

                    </div>

                  `
                  : ""
              }

            </div>


            ${winnersHTML}


          </div>

        `;

      })
      .join("");

}


// =========================================================
// SEARCH YOUR URN
// =========================================================

function searchURN() {

  const input =
    document.getElementById(
      "urn"
    );


  const result =
    document.getElementById(
      "result"
    );


  const urn =
    input.value
      .trim()
      .toUpperCase();


  if (!urn) {

    result.innerHTML =
      `<div class="error">

        Please enter your URN.

      </div>`;

    return;

  }


  const person =
    allIndividuals.find(
      function(item) {

        return String(
          item.urn || ""
        )
        .trim()
        .toUpperCase() === urn;

      }
    );


  if (!person) {

    result.innerHTML =
      `<div class="error">

        URN

        <strong>
          ${escapeHTML(urn)}
        </strong>

        was not found.

      </div>`;

    return;

  }


  result.innerHTML = `

    <div class="result">

      <h3>

        ${escapeHTML(
          person.name
        )}

      </h3>


      <p>

        <strong>
          URN:
        </strong>

        ${escapeHTML(
          person.urn
        )}

      </p>


      ${
        person.company
          ? `

            <p>

              <strong>
                Company:
              </strong>

              ${escapeHTML(
                person.company
              )}

            </p>

          `
          : ""
      }


      ${
        person.designation
          ? `

            <p>

              <strong>
                Designation:
              </strong>

              ${escapeHTML(
                person.designation
              )}

            </p>

          `
          : ""
      }


      ${
        person.team
          ? `

            <p>

              <strong>
                Team:
              </strong>

              ${escapeHTML(
                person.team
              )}

            </p>

          `
          : ""
      }


      <p>

        <strong>
          Rank:
        </strong>

        #${escapeHTML(
          person.rank || "-"
        )}

      </p>


      <div class="result-score">

        ${formatPoints(
          person.score
        )}

        Points

      </div>

    </div>

  `;

}


// =========================================================
// ENTER KEY FOR URN SEARCH
// =========================================================

document
  .getElementById("urn")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        searchURN();

      }

    }
  );


// =========================================================
// INITIAL LOAD
// =========================================================

loadScoreboard();


// =========================================================
// AUTO REFRESH EVERY 10 SECONDS
// =========================================================

setInterval(
  loadScoreboard,
  10000
);

</script>


</body>

</html>
