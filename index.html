<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Sabha 2026 | Live Scoreboard</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6fa;
color:#172033;
}

.header{
background:#111827;
color:white;
text-align:center;
padding:25px 15px;
}

.header h1{margin:0;font-size:28px}
.header p{margin:7px 0;color:#cbd5e1}

.wrap{
max-width:850px;
margin:auto;
padding:18px 14px 40px;
}

.card{
background:white;
border-radius:16px;
padding:18px;
margin-bottom:18px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.card h2{margin:0 0 14px}

.row{
display:grid;
grid-template-columns:50px 1fr auto;
gap:12px;
align-items:center;
padding:13px 0;
border-bottom:1px solid #eee;
}

.row:last-child{border-bottom:0}

.rank{
font-weight:bold;
text-align:center;
font-size:18px;
}

.name{
font-weight:bold;
font-size:17px;
}

.small{
font-size:13px;
color:#64748b;
margin-top:3px;
}

.points{
font-size:19px;
font-weight:bold;
text-align:right;
}

.dot{
display:inline-block;
width:10px;
height:10px;
border-radius:50%;
margin-right:5px;
}

.search{
display:flex;
gap:8px;
}

input{
flex:1;
padding:13px;
border:1px solid #ccd3df;
border-radius:10px;
font-size:16px;
}

button{
padding:12px 18px;
border:0;
border-radius:10px;
background:#2563eb;
color:white;
font-weight:bold;
}

.result{
margin-top:15px;
padding:15px;
background:#f8fafc;
border-radius:12px;
}

.error{
margin-top:12px;
padding:12px;
background:#fee2e2;
color:#991b1b;
border-radius:10px;
}

.updated{
text-align:center;
font-size:12px;
color:#64748b;
margin-top:10px;
}

@media(max-width:500px){
.search{flex-direction:column}
button{width:100%}
}
</style>
</head>

<body>

<div class="header">
<h1>🏆 TECH SABHA 2026</h1>
<p>Live Public Scoreboard</p>
</div>

<div class="wrap">

<div class="card">
<h2>⚔️ Team Leaderboard</h2>
<div id="teams">Loading...</div>
</div>

<div class="card">
<h2>🏆 Top 5</h2>
<div id="top5">Loading...</div>
<div id="updated"></div>
</div>

<div class="card">
<h2>🔎 Check Your Score</h2>

<div class="search">
<input id="urn" placeholder="Enter your URN e.g. TSJ026">
<button onclick="searchURN()">CHECK</button>
</div>

<div id="result"></div>
</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxiyaKhfpsuW0jx1eXrUcFRxixsbdp65LbOfDT6WtVUlLUeLDkUaNC01fK6iLF2jpeP/exec";

let data=[];

function colourDot(c){
let colors={
Red:"#ef4444",
Green:"#22c55e",
Blue:"#3b82f6",
Orange:"#f97316",
Yellow:"#eab308"
};
return '<span class="dot" style="background:'+(
colors[c]||"#64748b"
)+'"></span>';
}

function load(){

fetch(API+"?t="+Date.now())
.then(r=>r.json())
.then(json=>{

data=json;

showTeams();
showTop5();

document.getElementById("updated").innerText=
"Last updated: "+new Date().toLocaleTimeString();

})
.catch(()=>{

document.getElementById("teams").innerHTML=
'<div class="error">Unable to load live scores.</div>';

document.getElementById("top5").innerHTML=
'<div class="error">Unable to load live scores.</div>';

});

}

function showTeams(){

let totals={
Red:0,
Green:0,
Blue:0,
Orange:0,
Yellow:0
};

data.forEach(p=>{

let team=String(p.colour||"").trim();

let score=Number(
String(p.score||0).replace(/,/g,"")
)||0;

if(totals[team]!==undefined)
totals[team]+=score;

});

let teams=Object.entries(totals)
.sort((a,b)=>b[1]-a[1]);

document.getElementById("teams").innerHTML=

teams.map((t,i)=>{

let medal=i==0?"🥇":i==1?"🥈":i==2?"🥉":"";

return `
<div class="row">

<div class="rank">${medal}${i+1}</div>

<div class="name">
${colourDot(t[0])}${t[0]} Team
</div>

<div class="points">
${t[1].toLocaleString()} pts
</div>

</div>
`;

}).join("");

}

function showTop5(){

let top=data.slice(0,5);

document.getElementById("top5").innerHTML=

top.map((p,i)=>{

let medal=i==0?"🥇":i==1?"🥈":i==2?"🥉":"#"+(i+1);

return `
<div class="row">

<div class="rank">${medal}</div>

<div>

<div class="name">${p.name||""}</div>

<div class="small">
${p.urn||""} · ${colourDot(p.colour||"")}${p.colour||""}
</div>

</div>

<div class="points">
${p.score||0}
</div>

</div>
`;

}).join("");

}

function searchURN(){

let urn=document.getElementById("urn")
.value.trim().toUpperCase();

if(!urn){

document.getElementById("result").innerHTML=
'<div class="error">Please enter your URN.</div>';

return;

}

let p=data.find(x=>
String(x.urn||"").trim().toUpperCase()===urn
);

if(!p){

document.getElementById("result").innerHTML=
'<div class="error">URN not found. Please check your URN.</div>';

return;

}

document.getElementById("result").innerHTML=`

<div class="result">

<h2>${p.name||""}</h2>

<div class="small">${p.urn||""}</div>

<p>
<strong>Rank:</strong> #${p.rank||"-"}
</p>

<p>
<strong>Team:</strong>
${colourDot(p.colour||"")}${p.colour||""}
</p>

<p style="font-size:22px">
<strong>${p.score||0} Points</strong>
</p>

</div>
`;

}

document.getElementById("urn")
.addEventListener("keydown",function(e){

if(e.key==="Enter") searchURN();

});

load();

setInterval(load,10000);

</script>

</body>
</html>
